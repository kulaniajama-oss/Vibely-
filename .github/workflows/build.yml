name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  VIBELY_BACKEND_URL: ${{ vars.VIBELY_BACKEND_URL }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  VIMEO_ACCESS_TOKEN: ${{ secrets.VIMEO_ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip project
        run: |
          unzip -q Vibely-step11c.zip
          grep -q '^import java.util.Properties' Vibely/app/build.gradle.kts || sed -i '1i import java.util.Properties' Vibely/app/build.gradle.kts
          sed -i 's/java\.util\.Properties()/Properties()/' Vibely/app/build.gradle.kts
      - name: Add Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > Vibely/app/google-services.json
          fi
      - name: Build debug APK
        working-directory: Vibely
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Vibely-debug-apk
          path: Vibely/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

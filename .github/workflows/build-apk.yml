name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  VIBELY_BACKEND_URL: ${{ vars.VIBELY_BACKEND_URL }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  VIMEO_ACCESS_TOKEN: ${{ secrets.VIMEO_ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project (newest Vibely-*.zip in the repo)
        run: |
          newest=""
          newest_time=0
          for z in Vibely-*.zip; do
            [ -f "$z" ] || continue
            t=$(git log -1 --format=%ct -- "$z")
            t=${t:-0}
            if [ "$t" -ge "$newest_time" ]; then
              newest="$z"
              newest_time="$t"
            fi
          done
          if [ -z "$newest" ]; then
            echo "::error::No Vibely-*.zip found in the repo root."
            exit 1
          fi
          echo "Using: $newest"
          unzip -q -o "$newest"
          rm -rf __MACOSX
          ls

      - name: Fix Properties import (safety patch)
        run: |
          f=Vibely/app/build.gradle.kts
          grep -q '^import java.util.Properties' "$f" || sed -i '1i import java.util.Properties' "$f"
          sed -i 's/java\.util\.Properties()/Properties()/' "$f"

      - name: Add Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > Vibely/app/google-services.json
            echo "Firebase config added: cloud sync enabled."
          else
            echo "No GOOGLE_SERVICES_JSON secret: building without cloud sync."
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vibely-release.jks"
            echo "VIBELY_KEYSTORE_FILE=$RUNNER_TEMP/vibely-release.jks" >> "$GITHUB_ENV"
            echo "Signing key ready."
          else
            echo "::warning::No KEYSTORE_BASE64 secret: the release APK will not be signed."
          fi

      - name: Build release APK
        working-directory: Vibely
        env:
          VIBELY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VIBELY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VIBELY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export VIBELY_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibely-release-apk
          path: Vibely/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/vibely-release.jks" Vibely/app/google-services.json

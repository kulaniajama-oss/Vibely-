name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unzip project (newest Vibely*.zip in the repo)
        run: |
          newest=""
          newest_time=0
          for z in Vibely*.zip; do
            [ -f "$z" ] || continue
            t=$(git log -1 --format=%ct -- "$z")
            t=${t:-0}
            if [ "$t" -ge "$newest_time" ]; then
              newest="$z"
              newest_time="$t"
            fi
          done
          if [ -z "$newest" ]; then
            echo "::error::No Vibely*.zip found in the repo root."
            exit 1
          fi
          echo "Using: $newest"
          unzip -q -o "$newest"
          rm -rf __MACOSX
          # find the folder that contains gradlew (the project root)
          gradlew_path=$(find . -maxdepth 2 -name gradlew -not -path "./.git/*" | head -n 1)
          if [ -z "$gradlew_path" ]; then
            echo "::error::gradlew not found after unzip."
            exit 1
          fi
          project_dir=$(dirname "$gradlew_path")
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Project dir: $project_dir"
          ls "$project_dir"

      - name: Install Android SDK platform (compileSdk 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --console=plain \
            -DskipFormatKtlint \
            -x formatKtlint -x runKtlint -x runCheckstyle -x checkDependenciesOrder \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show error summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build error"
            echo '```'
            grep -n -A 25 "What went wrong" build.log | head -n 60
            echo '--- Kotlin / Java errors ---'
            grep -E "^e: |error:|FAILED" build.log | head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Show APK
        run: find "$PROJECT_DIR" -name "*.apk" -path "*outputs*" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibely-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
